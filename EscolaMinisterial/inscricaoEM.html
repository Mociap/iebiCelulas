<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Escola Ministerial</title>
    <link rel="shortcut icon" href="../assets/favico.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
/* Estilos copiados de formCadMembros.html */
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 0px;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            background-color: #2c2c2c;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .header {
            background-color: #2c2c2c;
            padding: 20px 0;
            text-align: center;
            position: relative;
            z-index: 1000;
        }

        .header img {
            max-width: 180px;
        }

        .divider {
            width: 75%;
            height: 2px;
            background-color: #3498db;
            margin: 30px auto;
        }

        .btn-primary {
            background-color: #3498db;
            border-color: #3498db;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #2980b9;
            border-color: #2980b9;
        }

        .form-control {
            background-color: #3c3c3c;
            border: none;
            color: #ffffff;
        }

        .form-control:focus {
            background-color: #4c4c4c;
            color: #ffffff;
            box-shadow: none;
        }

        label {
            color: #cfcccc;
            font-weight: bold;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: #2ecc71;
            color: #ffffff;
            padding: 10px;
            border-radius: 30px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            transition: all 0.3s ease;
            z-index: 1001;
        }

        .back-button:hover {
            background-color: #2ecc71;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-decoration: none;
            color: #ffffff;
        }

        .back-button i {
            margin-right: 0px;
        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .splash-screen.show {
            opacity: 1;
            visibility: visible;
        }

        .splash-content {
            text-align: center;
            color: white;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #fff;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .sugestoes {
            background-color: #3c3c3c;
            border-radius: 0 0 5px 5px;
            max-height: 200px;
            overflow-y: auto;
            position: absolute;
            width: 90%;
            z-index: 1000;
        }

        .sugestao-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #4c4c4c;
        }

        .sugestao-item:hover {
            background-color: #4c4c4c;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <a href="../index.html" class="back-button">
        <i class="fas fa-arrow-left"></i>
    </a>
    <div class="header">
        <img src="../assets/LogoBranco.png" alt="Logo da Igreja Evangélica Batista Itapevi">
    </div>
    <div class="container">
        <h2 class="text-center mb-4 font-weight-bold">Inscrição Escola Ministerial</h2>
        <div class="divider"></div>
        <form id="inscricaoForm">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <!-- Inputs ocultos para salvar os dados da pessoa selecionada -->
                <input type="hidden" id="id_pessoa">
                <input type="hidden" id="nome_pessoa_cache">
                <input type="hidden" id="contato_cache">
                
                <input type="text" class="form-control" id="nome" required autocomplete="off">
                <div id="sugestoesNomes" class="sugestoes"></div>
            </div>

            <div class="form-group">
                <label for="turma">Turma</label>
                <select class="form-control" id="turma" required></select>
            </div>

            <div style="height: 20px;"></div>

            <button type="submit" class="btn btn-primary btn-block" id="inscreverBtn">
                <i class="fas fa-user-plus mr-2"></i>Inscrever
            </button>

        </form>
        <div id="splash-screen" class="splash-screen">
            <div class="splash-content">
                <div class="spinner"></div>
                <p>Carregando dados...</p>
            </div>
        </div>

    </div>

    <!-- Importar Vanilla Masker -->
    <script src="https://unpkg.com/vanilla-masker@1.1.1/build/vanilla-masker.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp, getCountFromServer, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC31C1X13eqVAOq_o5K2evI8q3GOfnpOpo",
            authDomain: "iebi-2e84e.firebaseapp.com",
            projectId: "iebi-2e84e",
            storageBucket: "iebi-2e84e.firebasestorage.app",
            messagingSenderId: "634456198202",
            appId: "1:634456198202:web:8b4de1b4def23a49303903"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const formulario = document.getElementById('inscricaoForm');
        const inputNome = document.getElementById('nome');
        const selectTurma = document.getElementById('turma');
        
        let debounceTimer;

        inputNome.addEventListener('input', function() {
            this.value = this.value.toUpperCase();
            const texto = this.value;
            
            clearTimeout(debounceTimer);
            if (texto.trim() === '') {
                limparSelecaoPessoa();
                return;
            }
            
            debounceTimer = setTimeout(() => {
                buscarNomes(texto);
            }, 300);
        });

        function limparSelecaoPessoa() {
            document.getElementById('id_pessoa').value = '';
            document.getElementById('nome_pessoa_cache').value = '';
            document.getElementById('contato_cache').value = '';
            document.getElementById('sugestoesNomes').innerHTML = '';
        }

        async function buscarNomes(texto) {
            if (texto.length < 3) {
                document.getElementById('sugestoesNomes').innerHTML = '';
                return;
            }

            try {
                const pessoasRef = collection(db, 'igrejas/iebi/pessoas');
                const q = query(pessoasRef, where('nome', '>=', texto), where('nome', '<=', texto + '\uf8ff'));
                const querySnapshot = await getDocs(q);
                
                let sugestoes = '';
                window.sugestoesAtuais = [];
                
                let cont = 0;
                querySnapshot.forEach((doc) => {
                    if(cont < 5) {
                        const dados = doc.data();
                        window.sugestoesAtuais.push({id: doc.id, ...dados});
                        sugestoes += `<div class="sugestao-item" onclick="selecionarNome(${cont})">${dados.nome}</div>`;
                        cont++;
                    }
                });
                document.getElementById('sugestoesNomes').innerHTML = sugestoes;
            } catch (error) {
                console.error("Erro ao buscar nomes:", error);
            }
        }

        window.selecionarNome = function(index) {
            const pessoa = window.sugestoesAtuais[index];
            if(pessoa) {
                document.getElementById('nome').value = pessoa.nome;
                document.getElementById('id_pessoa').value = pessoa.id;
                document.getElementById('nome_pessoa_cache').value = pessoa.nome;
                document.getElementById('contato_cache').value = pessoa.celular || '';
                document.getElementById('sugestoesNomes').innerHTML = '';
            }
        };

        async function carregarTurmas() {
            selectTurma.innerHTML = '';
            
            try {
                const turmasRef = collection(db, 'igrejas/iebi/turmas');
                const q = query(turmasRef, where('status', '==', 'Inscrições Abertas'), where('inscricao_site', '==', true));
                const querySnapshot = await getDocs(q);
                
                const turmas = [];
                querySnapshot.forEach((doc) => {
                    turmas.push({ id: doc.id, ...doc.data() });
                });

                if (turmas.length === 0) {
                    const option = document.createElement('option');
                    option.value = "";
                    option.text = "Nenhuma turma com inscrições abertas";
                    selectTurma.add(option);
                } else {
                    const defaultOption = document.createElement('option');
                    defaultOption.value = "";
                    defaultOption.text = "Selecione a Turma...";
                    selectTurma.add(defaultOption);

                    for (const turma of turmas) {
                        const limiteVagas = Number(turma.vagas_totais) || 0;
                        const vagasOcupadas = Number(turma.vagas_ocupadas) || 0;
                        let isEsgotado = false;

                        if (limiteVagas > 0 && vagasOcupadas >= limiteVagas) {
                            isEsgotado = true;
                        }

                        const option = document.createElement('option');
                        option.value = turma.id;
                        option.dataset.nome_turma = turma.nome_turma;
                        option.dataset.nome_curso = turma.nome_curso_cache;
                        option.dataset.limite_vagas = limiteVagas;

                        if (isEsgotado) {
                            option.text = `${turma.nome_curso_cache} - ${turma.nome_turma} (Vagas Esgotadas)`;
                            option.disabled = true;
                        } else {
                            option.text = `${turma.nome_curso_cache} - ${turma.nome_turma}`;
                        }
                        selectTurma.add(option);
                    }
                }
            } catch (error) {
                console.error("Erro ao carregar turmas:", error);
                const option = document.createElement('option');
                option.value = "";
                option.text = "Erro ao carregar turmas";
                selectTurma.add(option);
            }
        }

        window.onload = async function () {
            document.getElementById('splash-screen').classList.add('show');
            await carregarTurmas();
            document.getElementById('splash-screen').classList.remove('show');
        };

        formulario.addEventListener('submit', async function (e) {
            e.preventDefault();

            const idPessoa = document.getElementById('id_pessoa').value;
            const nomePessoaCache = document.getElementById('nome_pessoa_cache').value;
            const contatoCache = document.getElementById('contato_cache').value;
            
            if (!idPessoa || !nomePessoaCache) {
                alert('Por favor, selecione um nome válido na lista de sugestões!');
                return;
            }

            if (selectTurma.selectedIndex === 0 || selectTurma.value === "") {
                alert('Por favor, selecione uma turma');
                return;
            }

            const optionTurma = selectTurma.options[selectTurma.selectedIndex];
            const idTurma = optionTurma.value;
            const nomeTurmaCache = optionTurma.dataset.nome_turma;
            const nomeCursoCache = optionTurma.dataset.nome_curso;

            document.getElementById('splash-screen').classList.add('show');
            
            try {
                // 1. Validar Duplicidade
                const inscricoesRef = collection(db, 'igrejas/iebi/inscricoes');
                const qDuplicidade = query(inscricoesRef, 
                    where('id_turma', '==', idTurma),
                    where('id_pessoa', '==', idPessoa)
                );
                
                const snapDuplicidade = await getDocs(qDuplicidade);
                
                if (!snapDuplicidade.empty) {
                    alert('Você já está inscrito nesta turma. É permitida apenas uma inscrição por turma.');
                    document.getElementById('splash-screen').classList.remove('show');
                    return;
                }

                // 2. Validar limite de vagas (caso tenham se esgotado enquanto o usuário preenchia a tela)
                const limiteVagas = Number(optionTurma.dataset.limite_vagas) || 0;
                if (limiteVagas > 0) {
                    const turmaDoc = await getDoc(doc(db, 'igrejas/iebi/turmas', idTurma));
                    if (turmaDoc.exists()) {
                        const vagasOcupadasAgora = Number(turmaDoc.data().vagas_ocupadas) || 0;
                        if (vagasOcupadasAgora >= limiteVagas) {
                            alert('Infelizmente as vagas para esta turma acabaram de se esgotar!');
                            document.getElementById('splash-screen').classList.remove('show');
                            await carregarTurmas(); // Atualiza a lista para bloquear a turma
                            return;
                        }
                    }
                }

                // 3. Gravar a Inscrição
                const novaInscricao = {
                    id_turma: idTurma,
                    id_pessoa: idPessoa,
                    nome_pessoa_cache: nomePessoaCache,
                    contato_cache: contatoCache,
                    nome_turma_cache: nomeTurmaCache,
                    nome_curso_cache: nomeCursoCache,
                    data_inscricao: serverTimestamp(),
                    status: 'Ativa'
                };

                await addDoc(inscricoesRef, novaInscricao);
                
                alert('Inscrição realizada com sucesso!');
                formulario.reset();
                limparSelecaoPessoa();
                
            } catch (error) {
                console.error("Erro ao realizar inscrição:", error);
                alert('Erro ao realizar inscrição: ' + error.message);
            } finally {
                document.getElementById('splash-screen').classList.remove('show');
            }
        });
    </script>
</body>
</html>
